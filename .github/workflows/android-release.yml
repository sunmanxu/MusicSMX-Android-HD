name: Android Release

# 只在推送 `android-v*` tag 时构建并发布 APK。
# 桌面版仓库用的是 `v*`，两边命名空间天然不冲突，不会互相误触发。
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 准备 Android SDK（用镜像自带的，缺啥补啥）
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-license"
          printf '\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$SDK/licenses/android-sdk-preview-license"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "没有 sdkmanager，交给 Gradle 自己补（AGP 的 sdkDownload 默认开启）"
          fi

      - name: 安装依赖并同步渲染层
        run: |
          npm ci
          npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: 取出版本号并重命名
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk "MusicSMX-${VER}-debug.apk"
          ls -lh MusicSMX-${VER}-debug.apk

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MusicSMX Android ${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: MusicSMX-${{ steps.ver.outputs.version }}-debug.apk
          generate_release_notes: true
